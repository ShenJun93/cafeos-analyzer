<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CafeOS validation feedback</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#1c1917;background:#f5f5f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:44px 20px}.card{background:#fff;border:1px solid #e7e5e4;border-radius:16px;padding:22px}.row{margin:14px 0}label{display:block;font-weight:600;margin-bottom:6px}select,input{font:inherit;width:100%;padding:10px;border:1px solid #d6d3d1;border-radius:8px}button{font:inherit;background:#1c1917;color:#fff;border:0;border-radius:9px;padding:11px 14px;cursor:pointer}.muted{color:#78716c;font-size:14px}</style></head><body><main class="wrap"><h1>Validation feedback</h1><p class="muted">Không yêu cầu tên, email hay số điện thoại. File JSON tạo ra chỉ chứa evidence cho product gate.</p><form id="f" class="card"><div class="row"><label>POS/source</label><select id="source"><option>kiotviet</option><option>cukcuk</option><option>sapo-fnb</option><option>ipos</option><option>pos365</option><option>excel-other</option></select></div><div class="row"><label>Số cửa hàng</label><input id="stores" type="number" min="1" value="3" required></div><div class="row"><label>Import Analyzer thành công?</label><select id="importSucceeded"><option value="true">Có</option><option value="false">Không</option></select></div><div class="row"><label>Đã đối chiếu orders/net sales với POS?</label><select id="reconciled"><option value="true">Có — khớp và tin metric</option><option value="false">Chưa / không khớp</option></select></div><div class="row"><label>Có insight mới/hữu ích?</label><select id="useful"><option value="true">Có</option><option value="false">Không</option></select></div><div class="row"><label>Bạn có muốn dùng lại hàng tuần?</label><select id="repeat"><option value="true">Có</option><option value="false">Không</option></select></div><div class="row"><label>Nếu auto-sync hằng ngày, bạn có muốn bật?</label><select id="sync"><option value="true">Có</option><option value="false">Không</option></select></div><div class="row"><label>Nếu tạo giá trị đều đặn, bạn có sẵn sàng trả tiền?</label><select id="wtp"><option value="true">Có</option><option value="false">Không</option></select></div><div class="row"><label>Khoảng giá/tháng</label><select id="band"><option value="0">0</option><option value="<500k">&lt;500K</option><option value="500k-1m">500K–1M</option><option value="1m-2m">1M–2M</option><option value="2m+">2M+</option></select></div><button type="submit">Tải validation record JSON</button></form></main><script>const q=new URLSearchParams(location.search);const yes=id=>document.getElementById(id).value==='true';document.getElementById('f').onsubmit=e=>{e.preventDefault();const stores=Number(document.getElementById('stores').value);const reconciled=yes('reconciled');const useful=yes('useful');const repeat=yes('repeat');const sync=yes('sync');const wtp=yes('wtp');const payload={id:crypto.randomUUID(),source:document.getElementById('source').value,storeCount:stores,importAttempted:true,importSucceeded:yes('importSucceeded'),reconciliationAttempted:reconciled,metricTrusted:reconciled,insightReviewed:true,usefulNewInsight:useful,repeatUseAsked:true,repeatUseIntent:repeat,continuousSyncAsked:true,continuousSyncIntent:sync,valueDemonstrated:useful,wtpAsked:useful,willingnessToPay:useful&&wtp,wtpBand:document.getElementById('band').value,acquisitionSource:q.get('utm_source')||'direct',acquisitionMedium:q.get('utm_medium')||'none',acquisitionCampaign:q.get('utm_campaign')||'none',privacyMode:'local-only'};const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cafeos-validation-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></body></html>
