name: CafeOS Visual QA (synthetic)
on:
  pull_request:
    paths:
      - "public/app.html"
      - "public/cafeos-ui.css"
      - "scripts/visual-qa-core-commerce.mjs"
      - ".github/workflows/cafeos-visual-qa.yml"
  push:
    branches: ["feat/cafeos-core-commerce-v1"]
    paths:
      - "public/app.html"
      - "public/cafeos-ui.css"
      - "scripts/visual-qa-core-commerce.mjs"
      - ".github/workflows/cafeos-visual-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned browser test dependency (workflow only)
        run: npm install --no-save --ignore-scripts playwright@1.64.1
      - name: Install headless Chromium for visual QA
        run: npx playwright install --with-deps chromium
      - name: Test real browser layout against synthetic API (no staging writes)
        run: node scripts/visual-qa-core-commerce.mjs
      - name: Preserve screenshots for independent inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cafeos-core-commerce-390-1200-synthetic-screenshots
          path: artifacts/cafeos-visual/
          retention-days: 7
          if-no-files-found: warn
