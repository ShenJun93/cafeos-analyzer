name: Supabase DB

on:
  push:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/database/**"
      - "supabase/restore-fixtures/**"
      - "scripts/run-supabase-restore-drill.sh"
      - "scripts/run-local-ledger-reconciliation-drill.sh"
      - "scripts/run-local-greenpath-ledger-drill.sh"
      - "scripts/run-local-age-backup-drill.sh"
      - "scripts/backup-cafeos-staging-age.sh"
      - "scripts/sql/cafeos-staging-post-repair-readonly-gate.sql"
      - "scripts/sql/cafeos-staging-post-guards-readonly-gate.sql"
      - "scripts/sql/cafeos-local-postguards-negative-fixture.sql"
      - ".github/workflows/supabase-db.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/database/**"
      - "supabase/restore-fixtures/**"
      - "scripts/run-supabase-restore-drill.sh"
      - "scripts/run-local-ledger-reconciliation-drill.sh"
      - "scripts/run-local-greenpath-ledger-drill.sh"
      - "scripts/run-local-age-backup-drill.sh"
      - "scripts/backup-cafeos-staging-age.sh"
      - "scripts/sql/cafeos-staging-post-repair-readonly-gate.sql"
      - "scripts/sql/cafeos-staging-post-guards-readonly-gate.sql"
      - "scripts/sql/cafeos-local-postguards-negative-fixture.sql"
      - ".github/workflows/supabase-db.yml"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_USE_SLIM_IMAGES: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Initialize local Supabase config
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase init
          python - <<'PY'
          from pathlib import Path
          p = Path("supabase/config.toml")
          s = p.read_text()
          s = s.replace("# auto_expose_new_tables = true", "auto_expose_new_tables = false")
          s = s.replace("[db.seed]\n# If enabled, seeds the database after migrations during a db reset.\nenabled = true",
                        "[db.seed]\n# If enabled, seeds the database after migrations during a db reset.\nenabled = false")
          p.write_text(s)
          PY

      - name: Start blank local Supabase stack and apply migrations
        run: supabase start

      - name: Run database tests
        run: supabase test db

      - name: Run isolated synthetic restore drill
        run: bash scripts/run-supabase-restore-drill.sh

      - name: Re-run database tests after restore
        run: supabase test db

      - name: Test history-only repair on disposable localhost
        run: bash scripts/run-local-ledger-reconciliation-drill.sh

      - name: Prove post-repair GREEN and guarded upgrade on disposable localhost
        run: bash scripts/run-local-greenpath-ledger-drill.sh

      - name: Install age and signed PGDG PostgreSQL 17 client for synthetic restore
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --proto '=https' --tlsv1.2             -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc             https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME"             | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Restore age-encrypted synthetic PostgreSQL backup to a separate local database
        run: bash scripts/run-local-age-backup-drill.sh

      - name: Show migration state
        if: always()
        run: supabase migration list --local || true

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true
